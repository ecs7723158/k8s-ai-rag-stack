name: K8s AI RAG Stack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-manifests-and-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate YAML Manifests Syntax
        run: |
          python3 -c "
          import yaml, glob
          for file in glob.glob('manifests/**/*.yaml', recursive=True):
              with open(file, 'r') as f:
                  yaml.safe_load_all(f)
              print(f'✓ Validated {file}')
          "

      - name: Run Benchmark Suites
        run: |
          python3 benchmarks/vllm_latency_benchmark.py --requests 10 --concurrency 2
          python3 benchmarks/rag_retrieval_eval.py
